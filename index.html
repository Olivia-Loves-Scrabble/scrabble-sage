<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrabble Sage - Anagram Learner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            line-height: 1.6;
            font-size: 16px;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        h2 {
            font-size: 32px;
            font-weight: bold;
            margin: 32px 0 16px 0;
        }

        h3 {
            font-size: 24px;
            font-weight: bold;
            margin: 24px 0 12px 0;
        }

        p {
            margin-bottom: 16px;
            color: #cbd5e1;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 12px;
            width: 100%;
            text-align: left;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            background-color: #1e40af;
        }

        button:focus {
            outline: 3px solid #60a5fa;
            outline-offset: 2px;
        }

        button.secondary {
            background-color: #64748b;
            width: auto;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        button.secondary:hover {
            background-color: #475569;
        }

        button.danger {
            background-color: #dc2626;
        }

        button.danger:hover {
            background-color: #b91c1c;
        }

        button.success {
            background-color: #16a34a;
        }

        button.success:hover {
            background-color: #15803d;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 16px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #334155;
            color: white;
        }

        input:focus, textarea:focus {
            outline: 3px solid #60a5fa;
            outline-offset: 2px;
            border-color: #60a5fa;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            margin-top: 12px;
        }

        .container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .word-list {
            background-color: #334155;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-item {
            background-color: #475569;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
        }

        .word-item button {
            width: auto;
            padding: 4px 8px;
            margin: 0;
            font-size: 14px;
        }

        .feedback {
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        .feedback.correct {
            background-color: #166534;
            color: #dcfce7;
            border: 1px solid #16a34a;
        }

        .feedback.partial {
            background-color: #713f12;
            color: #fef3c7;
            border: 1px solid #f59e0b;
        }

        .feedback.incorrect {
            background-color: #7f1d1d;
            color: #fee2e2;
            border: 1px solid #dc2626;
        }

        .jumbled-display {
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 8px;
            margin: 24px 0;
            padding: 24px;
            background-color: #334155;
            border-radius: 8px;
            text-align: center;
            color: #60a5fa;
        }

        .word-count {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .button-group button {
            width: 100%;
            margin: 0;
        }

        .hidden {
            display: none;
        }

        .progress {
            color: #94a3b8;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        .instructions {
            background-color: #1e3a8a;
            border: 1px solid #3b82f6;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .jumbled-display {
                font-size: 36px;
                letter-spacing: 4px;
            }

            button {
                padding: 14px 16px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main role="main" aria-label="Scrabble Sage - Anagram Learning Application">
        <!-- Screen 1: Menu -->
        <div id="menu-screen" class="hidden">
            <h1>Scrabble Sage</h1>
            <p>Learn anagrams with spaced repetition</p>

            <button onclick="app.showListManagement()" aria-label="Manage your word lists">
                ⚙️ Manage Lists
            </button>

            <div id="lists-container"></div>

            <div id="no-lists-message" class="instructions">
                <p>No word lists yet. Click "Manage Lists" to create one.</p>
            </div>
        </div>

        <!-- Screen 2: List Management -->
        <div id="management-screen" class="hidden">
            <button onclick="app.showMenu()" aria-label="Go back to main menu">← Back to Menu</button>

            <h2>Manage Your Word Lists</h2>

            <div class="container">
                <h3>Create New List</h3>
                <label for="new-list-name">List Name:</label>
                <input type="text" id="new-list-name" placeholder="e.g., 7-Letter Words" aria-label="Enter name for new word list">
                <button onclick="app.createNewList()" class="success" aria-label="Create new word list">➕ Create List</button>
            </div>

            <div id="management-lists-container"></div>
        </div>

        <!-- Screen 3: Studying -->
        <div id="study-screen" class="hidden">
            <button onclick="app.exitStudy()" aria-label="Exit study session and return to menu">← Exit Study</button>

            <h2 id="study-list-name"></h2>
            <div class="progress" aria-live="polite" aria-label="Current progress">
                <span id="word-position"></span>
            </div>

            <div class="jumbled-display" id="jumbled-word" role="heading" aria-level="3" aria-label="Jumbled letters"></div>

            <button onclick="app.readLettersAloud()" aria-label="Read jumbled letters aloud">🔊 Read Letters Aloud</button>

            <div id="anagram-info" class="instructions" aria-live="polite"></div>

            <label for="answer-input">Your Answer:</label>
            <input type="text" id="answer-input" placeholder="Enter the word or words" aria-label="Enter your answer">

            <div class="button-group">
                <button onclick="app.submitAnswer()" class="success" aria-label="Submit your answer">✓ Submit</button>
                <button onclick="app.revealAnswer()" class="secondary" aria-label="Reveal the correct answer">👁️ Reveal</button>
            </div>

            <div id="feedback-area" aria-live="assertive" aria-atomic="true"></div>

            <button onclick="app.nextWord()" id="next-button" class="hidden" aria-label="Move to the next word">→ Next Word</button>
        </div>
    </main>

    <script>
        const app = {
            lists: [],
            currentScreen: 'menu',
            currentListIndex: null,
            studySession: null,
            audioContext: null,

            // Initialize
            init() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.loadLists();
                this.showMenu();
            },

            // Storage
            loadLists() {
                const saved = localStorage.getItem('scrabbleLists');
                this.lists = saved ? JSON.parse(saved) : [];
            },

            saveLists() {
                localStorage.setItem('scrabbleLists', JSON.stringify(this.lists));
            },

            // Navigation
            showMenu() {
                this.hideAllScreens();
                this.currentScreen = 'menu';
                document.getElementById('menu-screen').classList.remove('hidden');
                this.renderLists();
                this.announceMessage('Main menu. You have ' + this.lists.length + ' word lists.');
            },

            showListManagement() {
                this.hideAllScreens();
                this.currentScreen = 'management';
                document.getElementById('management-screen').classList.remove('hidden');
                this.renderManagement();
                this.announceMessage('List management screen.');
            },

            showStudy(listIndex) {
                this.hideAllScreens();
                this.currentScreen = 'study';
                this.currentListIndex = listIndex;
                document.getElementById('study-screen').classList.remove('hidden');
                this.initStudySession(listIndex);
                this.displayCurrentWord();
                this.announceMessage('Study session started. Press read letters to hear the jumbled word.');
            },

            exitStudy() {
                if (confirm('Exit study session? Your progress will not be saved.')) {
                    this.showMenu();
                }
            },

            hideAllScreens() {
                document.getElementById('menu-screen').classList.add('hidden');
                document.getElementById('management-screen').classList.add('hidden');
                document.getElementById('study-screen').classList.add('hidden');
            },

            // List Management
            createNewList() {
                const nameInput = document.getElementById('new-list-name');
                const name = nameInput.value.trim();

                if (!name) {
                    this.announceMessage('Please enter a list name.');
                    return;
                }

                const newList = {
                    id: Date.now(),
                    name: name,
                    words: [],
                    createdAt: new Date().toISOString()
                };

                this.lists.push(newList);
                this.saveLists();
                nameInput.value = '';
                this.renderManagement();
                this.announceMessage('List ' + name + ' created.');
            },

            addWordToList(listIndex, word) {
                word = word.trim().toLowerCase();

                if (!word || word.length < 2) {
                    this.announceMessage('Word must be at least 2 letters.');
                    return;
                }

                const list = this.lists[listIndex];
                if (list.words.includes(word)) {
                    this.announceMessage('Word already in list.');
                    return;
                }

                list.words.push(word);
                this.saveLists();
                this.announceMessage('Word ' + word + ' added to list.');
                this.renderManagement();
            },

            addMultipleWords(listIndex, text) {
                if (!text.trim()) {
                    this.announceMessage('No words to add.');
                    return;
                }

                const list = this.lists[listIndex];
                const lines = text.split('\n');
                let addedCount = 0;
                let skippedCount = 0;
                const addedWords = [];

                for (let i = 0; i < lines.length; i++) {
                    const word = lines[i].trim().toLowerCase();

                    if (!word || word.length < 2) {
                        if (word) skippedCount++;
                        continue;
                    }

                    if (list.words.includes(word)) {
                        skippedCount++;
                        continue;
                    }

                    list.words.push(word);
                    addedCount++;
                    addedWords.push(word);
                }

                this.saveLists();
                
                let message = 'Added ' + addedCount + ' word' + (addedCount !== 1 ? 's' : '') + '.';
                if (skippedCount > 0) {
                    message += ' Skipped ' + skippedCount + ' (duplicates or invalid).';
                }
                
                this.announceMessage(message);
                this.renderManagement();
            },

            removeWordFromList(listIndex, wordIndex) {
                const word = this.lists[listIndex].words[wordIndex];
                this.lists[listIndex].words.splice(wordIndex, 1);
                this.saveLists();
                this.announceMessage('Word ' + word + ' removed from list.');
                this.renderManagement();
            },

            deleteList(listIndex) {
                const name = this.lists[listIndex].name;
                if (confirm('Delete list "' + name + '"? This cannot be undone.')) {
                    this.lists.splice(listIndex, 1);
                    this.saveLists();
                    this.renderManagement();
                    this.announceMessage('List ' + name + ' deleted.');
                }
            },

            renameList(listIndex, newName) {
                newName = newName.trim();
                if (!newName) {
                    this.announceMessage('Please enter a list name.');
                    return;
                }

                this.lists[listIndex].name = newName;
                this.saveLists();
                this.renderManagement();
                this.announceMessage('List renamed to ' + newName + '.');
            },

            // Render Functions
            renderLists() {
                const container = document.getElementById('lists-container');
                const noListsMsg = document.getElementById('no-lists-message');

                if (this.lists.length === 0) {
                    container.innerHTML = '';
                    noListsMsg.classList.remove('hidden');
                    return;
                }

                noListsMsg.classList.add('hidden');
                container.innerHTML = this.lists.map((list, idx) => `
                    <div class="container">
                        <h3>${this.escapeHtml(list.name)}</h3>
                        <p class="word-count">${list.words.length} words</p>
                        <button onclick="app.showStudy(${idx})" aria-label="Study list ${this.escapeHtml(list.name)}">
                            ▶️ Study This List
                        </button>
                    </div>
                `).join('');
            },

            renderManagement() {
                const container = document.getElementById('management-lists-container');
                container.innerHTML = this.lists.map((list, listIdx) => {
                    const wordsList = list.words.map((word, wordIdx) => `
                        <div class="word-item">
                            <span>${this.escapeHtml(word)}</span>
                            <button onclick="app.removeWordFromList(${listIdx}, ${wordIdx})" class="secondary danger" aria-label="Remove ${this.escapeHtml(word)} from list">✕</button>
                        </div>
                    `).join('');

                    return `
                        <div class="container">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <h3 style="margin: 0;">${this.escapeHtml(list.name)}</h3>
                                <div>
                                    <button onclick="
                                        const newName = prompt('Enter new list name:', '${this.escapeHtml(list.name)}');
                                        if (newName) app.renameList(${listIdx}, newName);
                                    " class="secondary" aria-label="Rename list ${this.escapeHtml(list.name)}">✏️</button>
                                    <button onclick="app.deleteList(${listIdx})" class="secondary danger" aria-label="Delete list ${this.escapeHtml(list.name)}">🗑️</button>
                                </div>
                            </div>

                            <p class="word-count">${list.words.length} words in this list</p>

                            ${wordsList ? '<h4 style="margin-top: 16px; font-size: 16px; font-weight: 600;">Words:</h4>' + wordsList : '<p>No words yet.</p>'}

                            <h4 style="margin-top: 24px; font-size: 16px; font-weight: 600;">Add Words</h4>
                            
                            <label for="add-word-${listIdx}" style="margin-top: 16px;">Add a single word:</label>
                            <input type="text" id="add-word-${listIdx}" placeholder="Enter a word" aria-label="Add single word to ${this.escapeHtml(list.name)}">
                            <button onclick="
                                const input = document.getElementById('add-word-${listIdx}');
                                app.addWordToList(${listIdx}, input.value);
                                input.value = '';
                                input.focus();
                            " class="success" aria-label="Add single word to list">➕ Add Word</button>

                            <label for="bulk-words-${listIdx}" style="margin-top: 24px;">Or paste multiple words (one per line):</label>
                            <textarea id="bulk-words-${listIdx}" placeholder="Paste words here - one word per line. Example: stop opts post spot" aria-label="Paste multiple words to ${this.escapeHtml(list.name)}" style="width: 100%; height: 150px; padding: 12px; margin-bottom: 12px; font-size: 16px; border: 1px solid #475569; border-radius: 6px; background-color: #334155; color: white; font-family: monospace;"></textarea>
                            <button onclick="
                                const textarea = document.getElementById('bulk-words-${listIdx}');
                                app.addMultipleWords(${listIdx}, textarea.value);
                                textarea.value = '';
                                textarea.focus();
                            " class="success" aria-label="Add all words from text area to list">➕ Add All Words</button>
                        </div>
                    `;
                }).join('');
            },

            // Study Session
            initStudySession(listIndex) {
                const list = this.lists[listIndex];
                this.studySession = {
                    listIndex: listIndex,
                    queue: [...list.words.map((w, i) => i)],
                    currentIndex: 0,
                    completed: [],
                    history: {}
                };
            },

            displayCurrentWord() {
                const list = this.lists[this.currentListIndex];
                const wordIndex = this.studySession.queue[this.studySession.currentIndex];
                const word = list.words[wordIndex];

                document.getElementById('study-list-name').textContent = list.name;
                document.getElementById('word-position').textContent = 
                    'Word ' + (this.studySession.currentIndex + 1) + ' of ' + this.studySession.queue.length;

                const jumbled = this.jumbleWord(word);
                document.getElementById('jumbled-word').textContent = jumbled;
                document.getElementById('jumbled-word').setAttribute('aria-label', 'Jumbled letters: ' + jumbled.split('').join(', '));

                // Check for anagrams
                const anagrams = this.getAnagrams(word, list.words);
                const anagramInfo = document.getElementById('anagram-info');
                if (anagrams.length > 1) {
                    anagramInfo.innerHTML = `<p>This word has <strong>${anagrams.length} anagrams</strong>. You must find them all. Enter them separated by spaces.</p>`;
                    anagramInfo.classList.remove('hidden');
                } else {
                    anagramInfo.classList.add('hidden');
                }

                document.getElementById('answer-input').value = '';
                document.getElementById('feedback-area').innerHTML = '';
                document.getElementById('next-button').classList.add('hidden');
                document.getElementById('answer-input').focus();

                // Read letters aloud automatically
                setTimeout(() => this.readLettersAloud(), 500);
            },

            // Word Manipulation
            jumbleWord(word) {
                const vowels = 'aeiou';
                const letters = word.toLowerCase().split('');
                const vowelLetters = letters.filter(l => vowels.includes(l)).sort();
                const consonantLetters = letters.filter(l => !vowels.includes(l)).sort();
                return vowelLetters.concat(consonantLetters).join('');
            },

            getAnagrams(word, wordList) {
                const sorted = word.toLowerCase().split('').sort().join('');
                return wordList.filter(w => w.toLowerCase().split('').sort().join('') === sorted);
            },

            // Answer Handling
            submitAnswer() {
                const list = this.lists[this.currentListIndex];
                const wordIndex = this.studySession.queue[this.studySession.currentIndex];
                const correctWord = list.words[wordIndex];
                const anagrams = this.getAnagrams(correctWord, list.words);

                const answerInput = document.getElementById('answer-input').value.trim();
                if (!answerInput) {
                    this.showFeedback('Please enter an answer.', 'incorrect');
                    this.playSound('incorrect');
                    return;
                }

                const userAnswers = answerInput.split(/[\s,]+/).filter(a => a.trim()).map(a => a.toLowerCase());
                const correctAnswers = userAnswers.filter(ans => 
                    anagrams.some(w => w.toLowerCase() === ans)
                );

                const allFound = correctAnswers.length === anagrams.length && 
                    new Set(correctAnswers.map(a => a.toLowerCase())).size === anagrams.length;

                if (allFound) {
                    this.playSound('correct');
                    const message = 'Correct! All ' + anagrams.length + ' anagrams found: ' + anagrams.join(', ');
                    this.showFeedback(message, 'correct');
                    this.scheduleRemoval(true);
                } else if (correctAnswers.length > 0) {
                    this.playSound('partial');
                    const message = 'Partially correct! You found: ' + correctAnswers.join(', ') + '. You need ' + 
                        (anagrams.length - correctAnswers.length) + ' more.';
                    this.showFeedback(message, 'partial');
                    this.scheduleRemoval(false, 35);
                } else {
                    this.playSound('incorrect');
                    const message = 'Not correct. Try again. The anagrams are: ' + anagrams.join(', ');
                    this.showFeedback(message, 'incorrect');
                    this.scheduleRemoval(false, 20);
                }
            },

            revealAnswer() {
                const list = this.lists[this.currentListIndex];
                const wordIndex = this.studySession.queue[this.studySession.currentIndex];
                const correctWord = list.words[wordIndex];
                const anagrams = this.getAnagrams(correctWord, list.words);
                const message = 'The answers are: ' + anagrams.join(', ');
                this.showFeedback(message, 'incorrect');
                this.scheduleRemoval(false, 20);
            },

            scheduleRemoval(isCorrect, withinItems = null) {
                document.getElementById('next-button').classList.remove('hidden');
                if (isCorrect) {
                    const wordIndex = this.studySession.queue[this.studySession.currentIndex];
                    this.studySession.queue.splice(this.studySession.currentIndex, 1);
                    this.studySession.completed.push(wordIndex);
                } else if (withinItems) {
                    const itemToMove = this.studySession.queue[this.studySession.currentIndex];
                    this.studySession.queue.splice(this.studySession.currentIndex, 1);
                    const randomPos = Math.floor(Math.random() * withinItems) + 1;
                    const insertAt = Math.min(this.studySession.currentIndex + randomPos, this.studySession.queue.length);
                    this.studySession.queue.splice(insertAt, 0, itemToMove);
                }
            },

            nextWord() {
                if (this.studySession.queue.length === 0) {
                    this.playSound('complete');
                    alert('You have completed this list!');
                    this.showMenu();
                    return;
                }

                if (this.studySession.currentIndex >= this.studySession.queue.length) {
                    this.studySession.currentIndex = this.studySession.queue.length - 1;
                }

                this.displayCurrentWord();
            },

            // Audio
            playSound(type) {
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                try {
                    switch(type) {
                        case 'correct':
                            const osc1 = ctx.createOscillator();
                            const gain1 = ctx.createGain();
                            osc1.connect(gain1);
                            gain1.connect(ctx.destination);
                            osc1.frequency.setValueAtTime(800, now);
                            gain1.gain.setValueAtTime(0.3, now);
                            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                            osc1.start(now);
                            osc1.stop(now + 0.2);
                            break;

                        case 'partial':
                            const osc2 = ctx.createOscillator();
                            const gain2 = ctx.createGain();
                            osc2.connect(gain2);
                            gain2.connect(ctx.destination);
                            osc2.frequency.setValueAtTime(500, now);
                            gain2.gain.setValueAtTime(0.3, now);
                            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                            osc2.start(now);
                            osc2.stop(now + 0.25);
                            break;

                        case 'incorrect':
                            const osc3 = ctx.createOscillator();
                            const gain3 = ctx.createGain();
                            osc3.connect(gain3);
                            gain3.connect(ctx.destination);
                            osc3.frequency.setValueAtTime(300, now);
                            gain3.gain.setValueAtTime(0.3, now);
                            gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                            osc3.start(now);
                            osc3.stop(now + 0.3);
                            break;

                        case 'complete':
                            const osc4a = ctx.createOscillator();
                            const osc4b = ctx.createOscillator();
                            const gain4 = ctx.createGain();
                            osc4a.connect(gain4);
                            osc4b.connect(gain4);
                            gain4.connect(ctx.destination);
                            osc4a.frequency.setValueAtTime(523, now);
                            osc4b.frequency.setValueAtTime(659, now);
                            gain4.gain.setValueAtTime(0.3, now);
                            gain4.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                            osc4a.start(now);
                            osc4b.start(now);
                            osc4a.stop(now + 0.4);
                            osc4b.stop(now + 0.4);
                            break;
                    }
                } catch(e) {
                    console.error('Audio error:', e);
                }
            },

            readLettersAloud() {
                const wordText = document.getElementById('jumbled-word').textContent;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const letters = wordText.split('').join(' ');
                    const utterance = new SpeechSynthesisUtterance(letters);
                    utterance.rate = 0.8;
                    utterance.pitch = 1;
                    window.speechSynthesis.speak(utterance);
                }
            },

            showFeedback(message, type) {
                const feedbackArea = document.getElementById('feedback-area');
                feedbackArea.className = 'feedback ' + type;
                feedbackArea.textContent = message;
                feedbackArea.setAttribute('role', 'status');
                feedbackArea.setAttribute('aria-live', 'assertive');
                feedbackArea.setAttribute('aria-atomic', 'true');
            },

            announceMessage(message) {
                const announcement = document.createElement('div');
                announcement.className = 'sr-only';
                announcement.setAttribute('role', 'status');
                announcement.setAttribute('aria-live', 'assertive');
                announcement.textContent = message;
                document.body.appendChild(announcement);
                setTimeout(() => announcement.remove(), 1000);
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        };

        // Initialize on page load
        window.addEventListener('load', () => app.init());
    </script>
</body>
</html>
