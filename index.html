<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Scrabble Sage - Anagram Learner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            line-height: 1.6;
            font-size: 16px;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
        }

        h1 { font-size: 48px; font-weight: bold; margin: 24px 0 12px 0; }
        h2 { font-size: 32px; font-weight: bold; margin: 32px 0 16px 0; }
        h3 { font-size: 24px; font-weight: bold; margin: 24px 0 12px 0; }
        p, label { margin-bottom: 16px; color: #cbd5e1; }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 12px;
            width: 100%;
            text-align: left;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #1d4ed8; }
        button:active { background-color: #1e40af; }
        button:focus { outline: 3px solid #60a5fa; outline-offset: 2px; }

        button.secondary {
            background-color: #64748b;
            width: auto;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        button.secondary:hover { background-color: #475569; }
        button.danger {
            background-color: #dc2626;
        }

        button.danger:hover { background-color: #b91c1c; }
        button.success {
            background-color: #16a34a;
        }

        button.success:hover { background-color: #15803d; }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 16px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #334155;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-appearance: none;
            -webkit-autocorrect: off;
            -webkit-spellcheck: off;
            spellcheck: false;
            autocorrect: off;
            autocomplete: off;
        }

        input:focus, textarea:focus {
            outline: 3px solid #60a5fa;
            outline-offset: 2px;
            border-color: #60a5fa;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            margin-top: 12px;
        }

        .container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .word-item {
            background-color: #475569;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
        }

        .word-item button {
            width: auto;
            padding: 4px 8px;
            margin: 0;
            font-size: 14px;
        }

        .feedback {
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        .feedback.correct {
            background-color: #166534;
            color: #dcfce7;
            border: 1px solid #16a34a;
        }

        .feedback.partial {
            background-color: #713f12;
            color: #fef3c7;
            border: 1px solid #f59e0b;
        }

        .feedback.incorrect {
            background-color: #7f1d1d;
            color: #fee2e2;
            border: 1px solid #dc2626;
        }

        .jumbled-display {
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 8px;
            margin: 24px 0;
            padding: 24px;
            background-color: #334155;
            border-radius: 8px;
            text-align: center;
            color: #60a5fa;
        }

        .word-count {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .button-group button {
            width: 100%;
            margin: 0;
        }

        .hidden {
            display: none;
        }

        .progress {
            color: #94a3b8;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        .instructions {
            background-color: #1e3a8a;
            border: 1px solid #3b82f6;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 36px; }
            .jumbled-display { font-size: 36px; letter-spacing: 4px; }
            button { padding: 14px 16px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <main role="main" aria-label="Scrabble Sage application">
        <div id="screen-announcer" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
        
        <!-- Menu Screen -->
        <div id="menu-screen">
            <h1>Scrabble Sage</h1>
            <p>Learn anagrams with spaced repetition</p>

            <button id="menu-manage-btn" aria-label="Manage your word lists">
                ⚙️ Manage Lists
            </button>

            <div id="lists-container"></div>

            <div id="no-lists-message" class="instructions">
                <p>No word lists yet. Click "Manage Lists" to create one.</p>
            </div>
        </div>

        <!-- Management Screen -->
        <div id="management-screen" class="hidden">
            <button id="mgmt-back-btn" aria-label="Go back to main menu">← Back to Menu</button>
            <h2>Manage Your Word Lists</h2>

            <div class="container">
                <h3>Create New List</h3>
                <label for="list-name-input">List Name:</label>
                <input type="text" id="list-name-input" placeholder="e.g., 7-Letter Words" aria-label="Enter name for new word list" autocomplete="off" spellcheck="false">
                <button id="create-list-btn" class="success" aria-label="Create new word list">➕ Create List</button>
            </div>

            <div id="management-lists-container"></div>
        </div>

        <!-- Study Screen -->
        <div id="study-screen" class="hidden">
            <button id="study-exit-btn" aria-label="Exit study session">← Exit Study</button>
            <h2 id="study-list-title"></h2>
            <div class="progress" id="study-progress" aria-live="polite" aria-atomic="true"></div>

            <div class="jumbled-display" id="jumbled-word" role="heading" aria-level="3"></div>

            <button id="read-letters-btn" aria-label="Read jumbled letters aloud">🔊 Read Letters Aloud</button>

            <div id="anagram-info" class="instructions" aria-live="polite" aria-atomic="true"></div>

            <label for="study-answer-input">Your Answer:</label>
            <input type="text" id="study-answer-input" placeholder="Enter the word or words" aria-label="Enter your answer" autocomplete="off" spellcheck="false">

            <div class="button-group">
                <button id="submit-btn" class="success" aria-label="Submit your answer">✓ Submit</button>
                <button id="reveal-btn" class="secondary" aria-label="Reveal the correct answer">👁️ Reveal</button>
            </div>

            <div id="feedback-area" aria-live="assertive" aria-atomic="true"></div>
            <button id="next-btn" class="hidden" aria-label="Move to the next word">→ Next Word</button>
        </div>
    </main>

    <script>
        const app = {
            lists: [],
            currentScreen: 'menu',
            currentListIndex: null,
            studySession: null,
            audioContext: null,
            currentFeedback: null,

            init() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.loadLists();
                this.setupEventListeners();
                this.showScreen('menu');
            },

            setupEventListeners() {
                document.getElementById('menu-manage-btn').addEventListener('click', () => this.showScreen('management'));
                document.getElementById('mgmt-back-btn').addEventListener('click', () => this.showScreen('menu'));
                document.getElementById('create-list-btn').addEventListener('click', () => this.createNewList());
                document.getElementById('study-exit-btn').addEventListener('click', () => this.exitStudy());
                document.getElementById('submit-btn').addEventListener('click', () => this.submitAnswer());
                document.getElementById('reveal-btn').addEventListener('click', () => this.revealAnswer());
                document.getElementById('read-letters-btn').addEventListener('click', () => this.readLettersAloud());
                document.getElementById('next-btn').addEventListener('click', () => this.nextWord());

                document.getElementById('study-answer-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.submitAnswer();
                });
            },

            loadLists() {
                const saved = localStorage.getItem('scrabbleLists');
                this.lists = saved ? JSON.parse(saved) : [];
            },

            saveLists() {
                localStorage.setItem('scrabbleLists', JSON.stringify(this.lists));
            },

            showScreen(screenName) {
                document.getElementById('menu-screen').classList.add('hidden');
                document.getElementById('management-screen').classList.add('hidden');
                document.getElementById('study-screen').classList.add('hidden');

                if (screenName === 'menu') {
                    document.getElementById('menu-screen').classList.remove('hidden');
                    this.announceScreen('Main menu. You have ' + this.lists.length + ' word lists.');
                    this.renderLists();
                } else if (screenName === 'management') {
                    document.getElementById('management-screen').classList.remove('hidden');
                    this.announceScreen('List management screen.');
                    this.renderManagement();
                    setTimeout(() => document.getElementById('list-name-input').focus(), 100);
                } else if (screenName === 'study') {
                    document.getElementById('study-screen').classList.remove('hidden');
                    this.announceScreen('Study session started. Press read letters to hear the jumbled word.');
                    this.displayCurrentWord();
                }

                this.currentScreen = screenName;
            },

            announceScreen(message) {
                const announcer = document.getElementById('screen-announcer');
                announcer.textContent = message;
                announcer.setAttribute('aria-live', 'assertive');
            },

            createNewList() {
                const nameInput = document.getElementById('list-name-input');
                const name = nameInput.value.trim();

                if (!name) {
                    this.announceScreen('Please enter a list name.');
                    return;
                }

                const newList = {
                    id: Date.now(),
                    name: name,
                    words: [],
                    createdAt: new Date().toISOString()
                };

                this.lists.push(newList);
                this.saveLists();
                nameInput.value = '';
                
                this.announceScreen('List ' + name + ' created. Now you can add words.');
                this.renderManagement();
                
                // Focus on the newly created list's add word input
                setTimeout(() => {
                    const newInput = document.getElementById('add-word-' + (this.lists.length - 1));
                    if (newInput) newInput.focus();
                }, 100);
            },

            addWordToList(listIndex, word) {
                word = word.trim().toLowerCase();

                if (!word || word.length < 2) {
                    this.announceScreen('Word must be at least 2 letters.');
                    return;
                }

                const list = this.lists[listIndex];
                if (list.words.includes(word)) {
                    this.announceScreen('Word already in list.');
                    return;
                }

                list.words.push(word);
                this.saveLists();
                this.announceScreen('Word ' + word + ' added to list.');
                this.renderManagement();
            },

            addMultipleWords(listIndex, text) {
                if (!text.trim()) {
                    this.announceScreen('No words to add.');
                    return;
                }

                const list = this.lists[listIndex];
                const lines = text.split('\n');
                let addedCount = 0;
                let skippedCount = 0;

                for (let i = 0; i < lines.length; i++) {
                    const word = lines[i].trim().toLowerCase();

                    if (!word || word.length < 2) {
                        if (word) skippedCount++;
                        continue;
                    }

                    if (list.words.includes(word)) {
                        skippedCount++;
                        continue;
                    }

                    list.words.push(word);
                    addedCount++;
                }

                this.saveLists();
                
                let message = 'Added ' + addedCount + ' word' + (addedCount !== 1 ? 's' : '') + '.';
                if (skippedCount > 0) {
                    message += ' Skipped ' + skippedCount + ' duplicates or invalid.';
                }
                
                this.announceScreen(message);
                this.renderManagement();
            },

            removeWordFromList(listIndex, wordIndex) {
                const word = this.lists[listIndex].words[wordIndex];
                this.lists[listIndex].words.splice(wordIndex, 1);
                this.saveLists();
                this.announceScreen('Word ' + word + ' removed from list.');
                this.renderManagement();
            },

            deleteList(listIndex) {
                const name = this.lists[listIndex].name;
                if (confirm('Delete list "' + name + '"? This cannot be undone.')) {
                    this.lists.splice(listIndex, 1);
                    this.saveLists();
                    this.announceScreen('List ' + name + ' deleted.');
                    this.renderManagement();
                }
            },

            renameList(listIndex, newName) {
                newName = newName.trim();
                if (!newName) {
                    this.announceScreen('Please enter a list name.');
                    return;
                }

                this.lists[listIndex].name = newName;
                this.saveLists();
                this.announceScreen('List renamed to ' + newName + '.');
                this.renderManagement();
            },

            renderLists() {
                const container = document.getElementById('lists-container');
                const noListsMsg = document.getElementById('no-lists-message');

                if (this.lists.length === 0) {
                    container.innerHTML = '';
                    noListsMsg.classList.remove('hidden');
                    return;
                }

                noListsMsg.classList.add('hidden');
                container.innerHTML = this.lists.map((list, idx) => `
                    <div class="container">
                        <h3>${this.escapeHtml(list.name)}</h3>
                        <p class="word-count">${list.words.length} words</p>
                        <button onclick="app.startStudy(${idx})" aria-label="Study list ${this.escapeHtml(list.name)}">
                            ▶️ Study This List
                        </button>
                    </div>
                `).join('');
            },

            renderManagement() {
                const container = document.getElementById('management-lists-container');
                container.innerHTML = this.lists.map((list, listIdx) => {
                    const wordsList = list.words.map((word, wordIdx) => `
                        <div class="word-item">
                            <span>${this.escapeHtml(word)}</span>
                            <button onclick="app.removeWordFromList(${listIdx}, ${wordIdx})" class="secondary danger" aria-label="Remove ${this.escapeHtml(word)} from list">✕</button>
                        </div>
                    `).join('');

                    return `
                        <div class="container">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                <h3 style="margin: 0;">${this.escapeHtml(list.name)}</h3>
                                <div>
                                    <button onclick="
                                        const newName = prompt('Enter new list name:', '${this.escapeHtml(list.name)}');
                                        if (newName) app.renameList(${listIdx}, newName);
                                    " class="secondary" aria-label="Rename list ${this.escapeHtml(list.name)}">✏️</button>
                                    <button onclick="app.deleteList(${listIdx})" class="secondary danger" aria-label="Delete list ${this.escapeHtml(list.name)}">🗑️</button>
                                </div>
                            </div>

                            <p class="word-count">${list.words.length} words in this list</p>

                            ${wordsList ? '<h4 style="margin-top: 16px; font-size: 16px; font-weight: 600;">Words:</h4>' + wordsList : '<p>No words yet.</p>'}

                            <h4 style="margin-top: 24px; font-size: 16px; font-weight: 600;">Add Words</h4>
                            
                            <label for="add-word-${listIdx}" style="margin-top: 16px;">Add a single word:</label>
                            <input type="text" id="add-word-${listIdx}" placeholder="Enter a word" aria-label="Add single word to ${this.escapeHtml(list.name)}" autocomplete="off" spellcheck="false">
                            <button onclick="
                                const input = document.getElementById('add-word-${listIdx}');
                                app.addWordToList(${listIdx}, input.value);
                                input.value = '';
                                input.focus();
                            " class="success" aria-label="Add single word to list">➕ Add Word</button>

                            <label for="bulk-words-${listIdx}" style="margin-top: 24px;">Or paste multiple words (one per line):</label>
                            <textarea id="bulk-words-${listIdx}" placeholder="Paste words here - one word per line. Example: stop opts post spot" aria-label="Paste multiple words to ${this.escapeHtml(list.name)}" style="width: 100%; height: 150px; padding: 12px; margin-bottom: 12px; font-size: 16px; border: 1px solid #475569; border-radius: 6px; background-color: #334155; color: white; font-family: monospace;" autocomplete="off" spellcheck="false"></textarea>
                            <button onclick="
                                const textarea = document.getElementById('bulk-words-${listIdx}');
                                app.addMultipleWords(${listIdx}, textarea.value);
                                textarea.value = '';
                                textarea.focus();
                            " class="success" aria-label="Add all words from text area to list">➕ Add All Words</button>
                        </div>
                    `;
                }).join('');
            },

            startStudy(listIndex) {
                this.currentListIndex = listIndex;
                this.initStudySession(listIndex);
                this.showScreen('study');
            },

            initStudySession(listIndex) {
                const list = this.lists[listIndex];
                
                const groups = {};
                list.words.forEach((word, idx) => {
                    const sorted = word.split('').sort().join('');
                    if (!groups[sorted]) {
                        groups[sorted] = [];
                    }
                    groups[sorted].push(idx);
                });

                let groupKeys = Object.keys(groups);
                groupKeys = this.shuffleArray(groupKeys);

                this.studySession = {
                    listIndex: listIndex,
                    groups: groups,
                    queue: groupKeys,
                    currentIndex: 0,
                    completed: [],
                };
            },

            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            },

            displayCurrentWord() {
                const list = this.lists[this.currentListIndex];
                
                if (this.studySession.queue.length === 0) {
                    this.playSound('complete');
                    alert('You have completed this list!');
                    this.showScreen('menu');
                    return;
                }

                const sortedLetters = this.studySession.queue[this.studySession.currentIndex];
                const wordIndices = this.studySession.groups[sortedLetters];
                const wordIndex = wordIndices[0];
                const word = list.words[wordIndex];

                document.getElementById('study-list-title').textContent = list.name;
                document.getElementById('study-progress').textContent = 
                    'Anagram set ' + (this.studySession.currentIndex + 1) + ' of ' + this.studySession.queue.length;

                const jumbled = this.jumbleWord(word);
                const jumbledDisplay = document.getElementById('jumbled-word');
                jumbledDisplay.textContent = jumbled;
                jumbledDisplay.setAttribute('aria-label', 'Jumbled letters: ' + jumbled.split('').join(', '));

                const anagrams = wordIndices.map(idx => list.words[idx]);
                
                const anagramInfo = document.getElementById('anagram-info');
                if (anagrams.length > 1) {
                    anagramInfo.innerHTML = `<p>This letter set has <strong>${anagrams.length} anagrams</strong>. You must find them all. Enter them separated by spaces.</p>`;
                    anagramInfo.classList.remove('hidden');
                } else {
                    anagramInfo.classList.add('hidden');
                }

                document.getElementById('study-answer-input').value = '';
                document.getElementById('feedback-area').innerHTML = '';
                document.getElementById('next-btn').classList.add('hidden');
                
                setTimeout(() => {
                    document.getElementById('study-answer-input').focus();
                    this.announceScreen('Anagram set ' + (this.studySession.currentIndex + 1) + ' of ' + this.studySession.queue.length);
                    setTimeout(() => this.readLettersAloud(), 300);
                }, 100);
            },

            jumbleWord(word) {
                const vowels = 'aeiou';
                const letters = word.toLowerCase().split('');
                const vowelLetters = letters.filter(l => vowels.includes(l)).sort();
                const consonantLetters = letters.filter(l => !vowels.includes(l)).sort();
                return vowelLetters.concat(consonantLetters).join('');
            },

            submitAnswer() {
                const list = this.lists[this.currentListIndex];
                const sortedLetters = this.studySession.queue[this.studySession.currentIndex];
                const wordIndices = this.studySession.groups[sortedLetters];
                const anagrams = wordIndices.map(idx => list.words[idx]).sort();

                const answerInput = document.getElementById('study-answer-input').value.trim();
                if (!answerInput) {
                    this.showFeedback('Please enter an answer.', 'incorrect');
                    this.playSound('incorrect');
                    return;
                }

                const userAnswers = answerInput.split(/[\s,]+/).filter(a => a.trim()).map(a => a.toLowerCase());
                
                // CRITICAL FIX: Check that EVERY user answer is valid
                const allAnswersValid = userAnswers.every(ans => 
                    anagrams.some(w => w.toLowerCase() === ans)
                );

                if (!allAnswersValid) {
                    // At least one answer is wrong - mark entire submission as incorrect
                    this.playSound('incorrect');
                    const invalidAnswers = userAnswers.filter(ans => 
                        !anagrams.some(w => w.toLowerCase() === ans)
                    );
                    const message = 'Not correct. You entered: ' + invalidAnswers.join(', ') + ' which is not an anagram. The anagrams are: ' + anagrams.join(', ');
                    this.showFeedback(message, 'incorrect');
                    this.currentFeedback = 'incorrect';
                    this.scheduleReappearance(20);
                    this.showNextButton();
                    return;
                }

                // All answers are valid - check if they found all anagrams
                const uniqueCorrectAnswers = new Set(userAnswers.map(a => a.toLowerCase()));
                const allFound = uniqueCorrectAnswers.size === anagrams.length;

                if (allFound) {
                    this.playSound('correct');
                    const message = 'Correct! All ' + anagrams.length + ' anagrams found: ' + anagrams.join(', ');
                    this.showFeedback(message, 'correct');
                    this.currentFeedback = 'correct';
                    this.showNextButton();
                } else if (userAnswers.length > 0) {
                    this.playSound('partial');
                    const message = 'Partially correct! You found: ' + userAnswers.join(', ') + '. You need ' + 
                        (anagrams.length - userAnswers.length) + ' more. Try entering the missing anagrams for the same letter set.';
                    this.showFeedback(message, 'partial');
                    this.currentFeedback = 'partial';
                    
                    setTimeout(() => {
                        document.getElementById('study-answer-input').value = '';
                        document.getElementById('study-answer-input').focus();
                        this.announceScreen('Answer cleared. Try entering the missing anagrams.');
                    }, 500);
                    return;
                } else {
                    this.playSound('incorrect');
                    const message = 'Not correct. Try again. The anagrams are: ' + anagrams.join(', ');
                    this.showFeedback(message, 'incorrect');
                    this.currentFeedback = 'incorrect';
                    this.scheduleReappearance(20);
                    this.showNextButton();
                }
            },

            revealAnswer() {
                const list = this.lists[this.currentListIndex];
                const sortedLetters = this.studySession.queue[this.studySession.currentIndex];
                const wordIndices = this.studySession.groups[sortedLetters];
                const anagrams = wordIndices.map(idx => list.words[idx]).sort();
                
                const message = 'The answers are: ' + anagrams.join(', ');
                this.showFeedback(message, 'incorrect');
                this.currentFeedback = 'revealed';
                this.scheduleReappearance(20);
                this.showNextButton();
            },

            scheduleReappearance(withinItems) {
                const itemToMove = this.studySession.queue[this.studySession.currentIndex];
                this.studySession.queue.splice(this.studySession.currentIndex, 1);
                const randomPos = Math.floor(Math.random() * withinItems) + 1;
                const insertAt = Math.min(this.studySession.currentIndex + randomPos, this.studySession.queue.length);
                this.studySession.queue.splice(insertAt, 0, itemToMove);
            },

            showNextButton() {
                document.getElementById('next-btn').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('next-btn').focus();
                    this.announceScreen('Click Next Word to continue.');
                }, 100);
            },

            nextWord() {
                if (this.currentFeedback === 'correct') {
                    const itemToRemove = this.studySession.queue[this.studySession.currentIndex];
                    this.studySession.queue.splice(this.studySession.currentIndex, 1);
                    this.studySession.completed.push(itemToRemove);
                }

                if (this.studySession.queue.length === 0) {
                    this.playSound('complete');
                    alert('You have completed this list!');
                    this.showScreen('menu');
                    return;
                }

                if (this.studySession.currentIndex >= this.studySession.queue.length) {
                    this.studySession.currentIndex = this.studySession.queue.length - 1;
                }

                this.displayCurrentWord();
            },

            exitStudy() {
                if (confirm('Exit study session? Your progress will not be saved.')) {
                    this.showScreen('menu');
                }
            },

            playSound(type) {
                const ctx = this.audioContext;
                const now = ctx.currentTime;

                try {
                    switch(type) {
                        case 'correct':
                            const osc1 = ctx.createOscillator();
                            const gain1 = ctx.createGain();
                            osc1.connect(gain1);
                            gain1.connect(ctx.destination);
                            osc1.frequency.setValueAtTime(800, now);
                            gain1.gain.setValueAtTime(0.3, now);
                            gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                            osc1.start(now);
                            osc1.stop(now + 0.2);
                            break;

                        case 'partial':
                            const osc2 = ctx.createOscillator();
                            const gain2 = ctx.createGain();
                            osc2.connect(gain2);
                            gain2.connect(ctx.destination);
                            osc2.frequency.setValueAtTime(500, now);
                            gain2.gain.setValueAtTime(0.3, now);
                            gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                            osc2.start(now);
                            osc2.stop(now + 0.25);
                            break;

                        case 'incorrect':
                            const osc3 = ctx.createOscillator();
                            const gain3 = ctx.createGain();
                            osc3.connect(gain3);
                            gain3.connect(ctx.destination);
                            osc3.frequency.setValueAtTime(300, now);
                            gain3.gain.setValueAtTime(0.3, now);
                            gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                            osc3.start(now);
                            osc3.stop(now + 0.3);
                            break;

                        case 'complete':
                            const osc4a = ctx.createOscillator();
                            const osc4b = ctx.createOscillator();
                            const gain4 = ctx.createGain();
                            osc4a.connect(gain4);
                            osc4b.connect(gain4);
                            gain4.connect(ctx.destination);
                            osc4a.frequency.setValueAtTime(523, now);
                            osc4b.frequency.setValueAtTime(659, now);
                            gain4.gain.setValueAtTime(0.3, now);
                            gain4.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                            osc4a.start(now);
                            osc4b.start(now);
                            osc4a.stop(now + 0.4);
                            osc4b.stop(now + 0.4);
                            break;
                    }
                } catch(e) {
                    console.error('Audio error:', e);
                }
            },

            readLettersAloud() {
                const wordText = document.getElementById('jumbled-word').textContent;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const letters = wordText.split('').join(' ');
                    const utterance = new SpeechSynthesisUtterance(letters);
                    utterance.rate = 0.8;
                    utterance.pitch = 1;
                    window.speechSynthesis.speak(utterance);
                }
            },

            showFeedback(message, type) {
                const feedbackArea = document.getElementById('feedback-area');
                feedbackArea.className = 'feedback ' + type;
                feedbackArea.textContent = message;
                feedbackArea.setAttribute('role', 'status');
                feedbackArea.setAttribute('aria-live', 'assertive');
                feedbackArea.setAttribute('aria-atomic', 'true');
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        };

        window.addEventListener('load', () => app.init());
    </script>
</body>
</html>
