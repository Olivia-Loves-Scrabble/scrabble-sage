<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Scrabble Sage - Anagram Learner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            line-height: 1.6;
            font-size: 16px;
        }
        main { max-width: 800px; margin: 0 auto; padding: 24px; min-height: 100vh; }
        h1 { font-size: 48px; font-weight: bold; margin: 24px 0 12px 0; }
        h2 { font-size: 32px; font-weight: bold; margin: 32px 0 16px 0; }
        h3 { font-size: 24px; font-weight: bold; margin: 24px 0 12px 0; }
        p, label { margin-bottom: 16px; color: #cbd5e1; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 12px;
            width: 100%;
            text-align: left;
            font-weight: 600;
        }
        button:focus { outline: 3px solid #60a5fa; outline-offset: 2px; }
        button.secondary {
            background-color: #64748b;
            width: auto;
            margin-right: 8px;
        }
        button.success { background-color: #16a34a; }
        button.danger { background-color: #dc2626; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 16px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #334155;
            color: white;
            -webkit-appearance: none;
            -webkit-autocorrect: off;
            -webkit-spellcheck: off;
            autocorrect: off;
            autocomplete: off;
        }
        input:focus, textarea:focus { outline: 3px solid #60a5fa; outline-offset: 2px; border-color: #60a5fa; }
        label { display: block; font-weight: 600; margin-bottom: 8px; margin-top: 12px; }
        .container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }
        .word-item {
            background-color: #475569;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
        }
        .word-item button {
            width: auto;
            padding: 4px 8px;
            margin: 0;
            font-size: 14px;
        }
        .feedback {
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 6px;
            font-weight: 600;
        }
        .feedback.correct {
            background-color: #166534;
            color: #dcfce7;
            border: 1px solid #16a34a;
        }
        .feedback.partial {
            background-color: #713f12;
            color: #fef3c7;
            border: 1px solid #f59e0b;
        }
        .feedback.incorrect {
            background-color: #7f1d1d;
            color: #fee2e2;
            border: 1px solid #dc2626;
        }
        .jumbled-display {
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 8px;
            margin: 24px 0;
            padding: 24px;
            background-color: #334155;
            border-radius: 8px;
            text-align: center;
            color: #60a5fa;
        }
        .word-count { font-size: 14px; color: #94a3b8; margin-top: 4px; }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .button-group button { width: 100%; margin: 0; }
        .instructions {
            background-color: #1e3a8a;
            border: 1px solid #3b82f6;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <main role="main">
        <h1>Scrabble Sage</h1>
        <p>Learn anagrams with spaced repetition</p>

        <button id="start-management-btn" aria-label="Manage word lists">⚙️ Manage Lists</button>

        <div id="menu-content">
            <div id="lists-container"></div>
            <div id="no-lists-message" class="instructions">
                <p>No word lists yet. Click "Manage Lists" to create one.</p>
            </div>
        </div>

        <div id="management-content" style="display: none;">
            <button id="back-to-menu-btn" aria-label="Go back to main menu">← Back to Menu</button>
            <h2>Manage Your Word Lists</h2>

            <div class="container">
                <h3>Create New List</h3>
                <label for="list-name-input">List Name:</label>
                <input type="text" id="list-name-input" placeholder="e.g., 7-Letter Words" aria-label="Enter name for new word list">
                <button id="create-list-btn" class="success">➕ Create List</button>
            </div>

            <div id="management-lists-container"></div>
        </div>

        <div id="study-content" style="display: none;">
            <button id="study-exit-btn" aria-label="Exit study session">← Exit Study</button>
            <h2 id="study-list-title"></h2>
            <div id="study-progress" aria-live="polite" aria-atomic="true"></div>

            <div class="jumbled-display" id="jumbled-word" role="heading" aria-level="3"></div>

            <button id="read-letters-btn" aria-label="Read jumbled letters aloud">🔊 Read Letters Aloud</button>

            <div id="anagram-info" class="instructions" aria-live="polite" aria-atomic="true"></div>

            <label for="study-answer-input">Your Answer:</label>
            <input type="text" id="study-answer-input" placeholder="Enter the word or words" aria-label="Enter your answer">

            <div class="button-group">
                <button id="submit-btn" class="success">✓ Submit</button>
                <button id="reveal-btn" class="secondary">👁️ Reveal</button>
            </div>

            <div id="feedback-area" aria-live="assertive" aria-atomic="true"></div>
            <button id="next-btn" style="display: none;">→ Next Word</button>
        </div>
    </main>

    <script>
        const app = {
            lists: [],
            currentListIndex: null,
            studySession: null,
            audioContext: null,
            currentFeedback: null,

            init() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.loadLists();
                this.setupEventListeners();
                this.renderMenu();
            },

            setupEventListeners() {
                document.getElementById('start-management-btn').addEventListener('click', () => this.showManagement());
                document.getElementById('back-to-menu-btn').addEventListener('click', () => this.showMenu());
                document.getElementById('create-list-btn').addEventListener('click', () => this.createNewList());
                document.getElementById('study-exit-btn').addEventListener('click', () => this.exitStudy());
                document.getElementById('submit-btn').addEventListener('click', () => this.submitAnswer());
                document.getElementById('reveal-btn').addEventListener('click', () => this.revealAnswer());
                document.getElementById('read-letters-btn').addEventListener('click', () => this.readLettersAloud());
                document.getElementById('next-btn').addEventListener('click', () => this.nextWord());

                document.getElementById('study-answer-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.submitAnswer();
                });
            },

            loadLists() {
                const saved = localStorage.getItem('scrabbleLists');
                this.lists = saved ? JSON.parse(saved) : [];
            },

            saveLists() {
                localStorage.setItem('scrabbleLists', JSON.stringify(this.lists));
            },

            showMenu() {
                document.getElementById('menu-content').style.display = 'block';
                document.getElementById('management-content').style.display = 'none';
                document.getElementById('study-content').style.display = 'none';
                this.renderMenu();
                this.announceToScreenReader('Main menu');
            },

            showManagement() {
                document.getElementById('menu-content').style.display = 'none';
                document.getElementById('management-content').style.display = 'block';
                document.getElementById('study-content').style.display = 'none';
                this.renderManagement();
                this.announceToScreenReader('List management. You can create a new list or edit existing lists.');
                setTimeout(() => document.getElementById('list-name-input').focus(), 100);
            },

            showStudy(listIndex) {
                this.currentListIndex = listIndex;
                this.initStudySession(listIndex);
                document.getElementById('menu-content').style.display = 'none';
                document.getElementById('management-content').style.display = 'none';
                document.getElementById('study-content').style.display = 'block';
                this.displayCurrentWord();
                this.announceToScreenReader('Study session started');
                setTimeout(() => this.readLettersAloud(), 800);
            },

            announceToScreenReader(message) {
                const announcement = document.createElement('div');
                announcement.className = 'sr-only';
                announcement.setAttribute('role', 'status');
                announcement.setAttribute('aria-live', 'assertive');
                announcement.textContent = message;
                document.body.appendChild(announcement);
                setTimeout(() => announcement.remove(), 2000);
            },

            renderMenu() {
                const container = document.getElementById('lists-container');
                const noMsg = document.getElementById('no-lists-message');

                if (this.lists.length === 0) {
                    container.innerHTML = '';
                    noMsg.style.display = 'block';
                    return;
                }

                noMsg.style.display = 'none';
                container.innerHTML = this.lists.map((list, idx) => `
                    <div class="container">
                        <h3>${this.escapeHtml(list.name)}</h3>
                        <p class="word-count">${list.words.length} words</p>
                        <button onclick="app.showStudy(${idx})" aria-label="Study ${this.escapeHtml(list.name)}">
                            ▶️ Study This List
                        </button>
                    </div>
                `).join('');
            },

            renderManagement() {
                const container = document.getElementById('management-lists-container');
                container.innerHTML = this.lists.map((list, listIdx) => {
                    const wordsList = list.words.map((word, wordIdx) => `
                        <div class="word-item">
                            <span>${this.escapeHtml(word)}</span>
                            <button onclick="app.removeWordFromList(${listIdx}, ${wordIdx})" class="secondary danger" aria-label="Remove ${this.escapeHtml(word)}">✕</button>
                        </div>
                    `).join('');

                    return `
                        <div class="container">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                                <h3 style="margin: 0;">${this.escapeHtml(list.name)}</h3>
                                <div>
                                    <button onclick="
                                        const n = prompt('New name:', '${this.escapeHtml(list.name)}');
                                        if (n) app.renameList(${listIdx}, n);
                                    " class="secondary">✏️</button>
                                    <button onclick="app.deleteList(${listIdx})" class="secondary danger">🗑️</button>
                                </div>
                            </div>
                            <p class="word-count">${list.words.length} words</p>
                            ${wordsList ? '<h4 style="margin-top: 16px; font-size: 16px; font-weight: 600;">Words:</h4>' + wordsList : '<p>No words yet.</p>'}
                            <h4 style="margin-top: 24px; font-size: 16px; font-weight: 600;">Add Words</h4>
                            <label for="add-single-${listIdx}">Add single word:</label>
                            <input type="text" id="add-single-${listIdx}" placeholder="Enter word" autocomplete="off">
                            <button onclick="const i = document.getElementById('add-single-${listIdx}'); app.addWordToList(${listIdx}, i.value); i.value = ''; i.focus();" class="success">➕ Add</button>
                            <label for="bulk-${listIdx}" style="margin-top: 20px;">Or paste multiple words:</label>
                            <textarea id="bulk-${listIdx}" placeholder="One word per line" style="width: 100%; height: 150px; padding: 12px; margin-bottom: 12px; font-size: 16px; border: 1px solid #475569; border-radius: 6px; background-color: #334155; color: white; font-family: monospace;" autocomplete="off"></textarea>
                            <button onclick="const t = document.getElementById('bulk-${listIdx}'); app.addMultipleWords(${listIdx}, t.value); t.value = ''; t.focus();" class="success">➕ Add All</button>
                        </div>
                    `;
                }).join('');
            },

            createNewList() {
                const name = document.getElementById('list-name-input').value.trim();
                if (!name) {
                    this.announceToScreenReader('Please enter a list name');
                    return;
                }
                const list = {
                    id: Date.now(),
                    name: name,
                    words: [],
                    createdAt: new Date().toISOString()
                };
                this.lists.push(list);
                this.saveLists();
                document.getElementById('list-name-input').value = '';
                this.renderManagement();
                this.announceToScreenReader('List ' + name + ' created. Scroll down to add words.');
                setTimeout(() => {
                    const newInput = document.getElementById('add-single-' + (this.lists.length - 1));
                    if (newInput) newInput.focus();
                }, 200);
            },

            addWordToList(listIdx, word) {
                word = word.trim().toLowerCase();
                if (!word || word.length < 2) {
                    this.announceToScreenReader('Word must be at least 2 letters');
                    return;
                }
                if (this.lists[listIdx].words.includes(word)) {
                    this.announceToScreenReader('Word already in list');
                    return;
                }
                this.lists[listIdx].words.push(word);
                this.saveLists();
                this.renderManagement();
                this.announceToScreenReader('Word ' + word + ' added');
            },

            addMultipleWords(listIdx, text) {
                if (!text.trim()) {
                    this.announceToScreenReader('No words to add');
                    return;
                }
                const lines = text.split('\n');
                let added = 0, skipped = 0;
                lines.forEach(line => {
                    const word = line.trim().toLowerCase();
                    if (word && word.length >= 2 && !this.lists[listIdx].words.includes(word)) {
                        this.lists[listIdx].words.push(word);
                        added++;
                    } else if (word) {
                        skipped++;
                    }
                });
                this.saveLists();
                this.renderManagement();
                this.announceToScreenReader('Added ' + added + ' words' + (skipped ? ', skipped ' + skipped : ''));
            },

            removeWordFromList(listIdx, wordIdx) {
                const word = this.lists[listIdx].words[wordIdx];
                this.lists[listIdx].words.splice(wordIdx, 1);
                this.saveLists();
                this.renderManagement();
                this.announceToScreenReader('Removed ' + word);
            },

            deleteList(listIdx) {
                if (confirm('Delete this list?')) {
                    const name = this.lists[listIdx].name;
                    this.lists.splice(listIdx, 1);
                    this.saveLists();
                    this.renderManagement();
                    this.announceToScreenReader('Deleted ' + name);
                }
            },

            renameList(listIdx, newName) {
                newName = newName.trim();
                if (!newName) return;
                this.lists[listIdx].name = newName;
                this.saveLists();
                this.renderManagement();
                this.announceToScreenReader('Renamed to ' + newName);
            },

            initStudySession(listIdx) {
                const list = this.lists[listIdx];
                const groups = {};
                list.words.forEach((word, idx) => {
                    const sorted = word.split('').sort().join('');
                    if (!groups[sorted]) groups[sorted] = [];
                    groups[sorted].push(idx);
                });
                let groupKeys = Object.keys(groups);
                groupKeys = this.shuffleArray(groupKeys);
                this.studySession = {
                    listIndex: listIdx,
                    groups: groups,
                    queue: groupKeys,
                    currentIndex: 0,
                    completed: [],
                };
            },

            shuffleArray(arr) {
                const s = [...arr];
                for (let i = s.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [s[i], s[j]] = [s[j], s[i]];
                }
                return s;
            },

            displayCurrentWord() {
                const list = this.lists[this.currentListIndex];
                if (this.studySession.queue.length === 0) {
                    this.playSound('complete');
                    alert('List complete!');
                    this.showMenu();
                    return;
                }
                const sorted = this.studySession.queue[this.studySession.currentIndex];
                const indices = this.studySession.groups[sorted];
                const word = list.words[indices[0]];
                const jumbled = this.jumbleWord(word);
                const anagrams = indices.map(i => list.words[i]).sort();

                document.getElementById('study-list-title').textContent = list.name;
                document.getElementById('study-progress').textContent = 'Set ' + (this.studySession.currentIndex + 1) + ' of ' + this.studySession.queue.length;
                
                const display = document.getElementById('jumbled-word');
                display.textContent = jumbled;
                display.setAttribute('aria-label', 'Letters: ' + jumbled.split('').join(' '));

                const info = document.getElementById('anagram-info');
                if (anagrams.length > 1) {
                    info.innerHTML = '<p><strong>' + anagrams.length + ' anagrams.</strong> Find them all.</p>';
                    info.style.display = 'block';
                } else {
                    info.style.display = 'none';
                }

                document.getElementById('study-answer-input').value = '';
                document.getElementById('feedback-area').innerHTML = '';
                document.getElementById('next-btn').style.display = 'none';
                
                setTimeout(() => {
                    document.getElementById('study-answer-input').focus();
                    this.announceToScreenReader('Set ' + (this.studySession.currentIndex + 1));
                    setTimeout(() => this.readLettersAloud(), 400);
                }, 100);
            },

            jumbleWord(word) {
                const vowels = 'aeiou';
                const letters = word.toLowerCase().split('');
                const vowelLetters = letters.filter(l => vowels.includes(l)).sort();
                const consonantLetters = letters.filter(l => !vowels.includes(l)).sort();
                return vowelLetters.concat(consonantLetters).join('');
            },

            submitAnswer() {
                const list = this.lists[this.currentListIndex];
                const sorted = this.studySession.queue[this.studySession.currentIndex];
                const indices = this.studySession.groups[sorted];
                const anagrams = indices.map(i => list.words[i]).sort();

                const input = document.getElementById('study-answer-input').value.trim();
                if (!input) {
                    this.showFeedback('Enter an answer', 'incorrect');
                    this.playSound('incorrect');
                    return;
                }

                const answers = input.split(/[\s,]+/).filter(a => a.trim()).map(a => a.toLowerCase());
                
                const allValid = answers.every(ans => anagrams.some(w => w.toLowerCase() === ans));
                
                if (!allValid) {
                    const invalid = answers.filter(ans => !anagrams.some(w => w.toLowerCase() === ans));
                    this.playSound('incorrect');
                    this.showFeedback('Not correct: ' + invalid.join(', ') + ' is not an anagram. Correct: ' + anagrams.join(', '), 'incorrect');
                    this.currentFeedback = 'incorrect';
                    this.scheduleReappear(20);
                    this.showNextBtn();
                    return;
                }

                const unique = new Set(answers.map(a => a.toLowerCase()));
                const allFound = unique.size === anagrams.length;

                if (allFound) {
                    this.playSound('correct');
                    this.showFeedback('Correct! ' + anagrams.join(', '), 'correct');
                    this.currentFeedback = 'correct';
                    this.showNextBtn();
                } else {
                    this.playSound('partial');
                    this.showFeedback('Partial: Found ' + answers.length + ', need ' + (anagrams.length - answers.length) + ' more', 'partial');
                    this.currentFeedback = 'partial';
                    setTimeout(() => {
                        document.getElementById('study-answer-input').value = '';
                        document.getElementById('study-answer-input').focus();
                        this.announceToScreenReader('Cleared. Try again.');
                    }, 500);
                    return;
                }
            },

            revealAnswer() {
                const list = this.lists[this.currentListIndex];
                const sorted = this.studySession.queue[this.studySession.currentIndex];
                const indices = this.studySession.groups[sorted];
                const anagrams = indices.map(i => list.words[i]).sort();
                this.playSound('incorrect');
                this.showFeedback('Answers: ' + anagrams.join(', '), 'incorrect');
                this.currentFeedback = 'revealed';
                this.scheduleReappear(20);
                this.showNextBtn();
            },

            scheduleReappear(within) {
                const item = this.studySession.queue[this.studySession.currentIndex];
                this.studySession.queue.splice(this.studySession.currentIndex, 1);
                const pos = Math.floor(Math.random() * within) + 1;
                const at = Math.min(this.studySession.currentIndex + pos, this.studySession.queue.length);
                this.studySession.queue.splice(at, 0, item);
            },

            showNextBtn() {
                document.getElementById('next-btn').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('next-btn').focus();
                    this.announceToScreenReader('Press next word button to continue');
                }, 100);
            },

            nextWord() {
                if (this.currentFeedback === 'correct') {
                    const item = this.studySession.queue[this.studySession.currentIndex];
                    this.studySession.queue.splice(this.studySession.currentIndex, 1);
                    this.studySession.completed.push(item);
                }
                if (this.studySession.queue.length === 0) {
                    this.playSound('complete');
                    alert('List complete!');
                    this.showMenu();
                    return;
                }
                if (this.studySession.currentIndex >= this.studySession.queue.length) {
                    this.studySession.currentIndex = this.studySession.queue.length - 1;
                }
                this.displayCurrentWord();
            },

            exitStudy() {
                if (confirm('Exit?')) {
                    this.showMenu();
                }
            },

            playSound(type) {
                const ctx = this.audioContext;
                const now = ctx.currentTime;
                try {
                    if (type === 'correct') {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.setValueAtTime(800, now);
                        g.gain.setValueAtTime(0.3, now);
                        g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        o.start(now); o.stop(now + 0.2);
                    } else if (type === 'partial') {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.setValueAtTime(500, now);
                        g.gain.setValueAtTime(0.3, now);
                        g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                        o.start(now); o.stop(now + 0.25);
                    } else if (type === 'incorrect') {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.setValueAtTime(300, now);
                        g.gain.setValueAtTime(0.3, now);
                        g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        o.start(now); o.stop(now + 0.3);
                    } else if (type === 'complete') {
                        const o1 = ctx.createOscillator();
                        const o2 = ctx.createOscillator();
                        const g = ctx.createGain();
                        o1.connect(g); o2.connect(g); g.connect(ctx.destination);
                        o1.frequency.setValueAtTime(523, now);
                        o2.frequency.setValueAtTime(659, now);
                        g.gain.setValueAtTime(0.3, now);
                        g.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        o1.start(now); o2.start(now);
                        o1.stop(now + 0.4); o2.stop(now + 0.4);
                    }
                } catch(e) {}
            },

            readLettersAloud() {
                const text = document.getElementById('jumbled-word').textContent;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text.split('').join(' '));
                    u.rate = 0.8;
                    window.speechSynthesis.speak(u);
                }
            },

            showFeedback(msg, type) {
                const area = document.getElementById('feedback-area');
                area.className = 'feedback ' + type;
                area.textContent = msg;
                area.setAttribute('aria-live', 'assertive');
            },

            escapeHtml(text) {
                const d = document.createElement('div');
                d.textContent = text;
                return d.innerHTML;
            }
        };

        window.addEventListener('load', () => app.init());
    </script>
</body>
</html>
